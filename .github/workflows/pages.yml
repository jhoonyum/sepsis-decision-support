# Publishes web/ (the decision-support screen and its synthetic-patient data) to GitHub Pages.
# Started by hand (Actions -> Screen on GitHub Pages -> Run workflow) after the release check;
# needs Settings -> Pages -> Source: "GitHub Actions" once. Never runs while the repository is
# private. After the v0.1 release, a push trigger on web/** can be added back.
name: Screen on GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
